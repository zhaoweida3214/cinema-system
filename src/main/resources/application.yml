server:
  port: 8080

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    driver-class-name: ${sky.datasource.driver-class-name}
    url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 1234

mybatis:
  #mapper 配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: org.example.cinemaseat.pojo
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

# Redis 配置
redis:
  host: ${sky.redis.host:localhost}
  port: ${sky.redis.port:6379}
  password: ${sky.redis.password:}
  database: ${sky.redis.database:0}
  timeout: 10000ms
  lettuce:
    pool:
      max-active: 100
      max-idle: 50
      min-idle: 10
      max-wait: 3000ms

# Caffeine 缓存配置
cache:
  caffeine:
    # 最大缓存数量
    max-size: 10000
    # 缓存过期时间（秒）
    expire-after-write: 300
    # 缓存加载时间（秒）
    refresh-after-write: 180

# 分布式锁配置
distributed-lock:
  # 等待锁的时间（秒）
  wait-time: 5
  # 锁持有时间（秒）
  lease-time: 30
  # 重试间隔（毫秒）
  retry-interval: 100

# RabbitMQ 配置
spring:
  rabbitmq:
    host: ${sky.rabbitmq.host:localhost}
    port: ${sky.rabbitmq.port:5672}
    username: ${sky.rabbitmq.username:guest}
    password: ${sky.rabbitmq.password:guest}
    virtual-host: ${sky.rabbitmq.virtual-host:/}
    # 生产者确认机制
    publisher-confirm-type: correlated
    publisher-returns: true
    # 消费者手动 ACK
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          max-interval: 10000ms

# 消息队列配置
mq:
  exchange:
    # 订单交换机
    order: order.exchange
    # 直连交换机
    direct: order.direct.exchange
  queue:
    # 短信队列
    sms: order.sms.queue
    # 积分队列
    points: order.points.queue
    # 延迟队列（订单超时取消）
    delay: order.delay.queue
  routing-key:
    # 短信路由键
    sms: order.sms
    # 积分路由键
    points: order.points
    # 延迟路由键
    delay: order.delay
  # 消息 TTL（15 分钟订单超时）
  message-ttl: 900000
